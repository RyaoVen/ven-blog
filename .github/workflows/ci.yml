name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  go:
    name: Go（网关+业务）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frame/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: frame/go/go.sum
      - run: go build ./...
      - run: go vet ./...
      # -race 补上本机（Windows）跑不了的并发检查
      - run: go test -race ./...

  node:
    name: Node（SSR worker）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frame/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frame/node/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: 部署工具（tools/deploy）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: tools/deploy/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
